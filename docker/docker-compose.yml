version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: potfosin-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: potfosin
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: potfosin-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: potfosin-gateway
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - GATEWAY_PORT=3000
      - REDIS_HOST=redis
      - PORTFOLIO_SERVICE_HOST=portfolio-service
    depends_on:
      - redis
      - portfolio-service
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:dev gateway

  portfolio-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: potfosin-portfolio-service
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      - PORTFOLIO_SERVICE_PORT=3001
      - PORTFOLIO_SERVICE_TCP_PORT=4001
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:dev portfolio-service

volumes:
  postgres-data:
  redis-data:
